<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>HomeHuddle · Family Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#0A1628;--navy-mid:#0F1F3D;--navy-light:#162444;
      --gold:#F5C518;--gold-dim:#c49e10;
      --white:#F0F4FF;--muted:#7A8FAD;
      --card-bg:#111D35;--border:rgba(245,197,24,0.12);--radius:10px;
    }
    html{scroll-behavior:smooth}
    body{background:var(--navy);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh}

    /* HEADER */
    #siteHeader{position:-webkit-sticky;position:sticky;top:0;z-index:300;background:var(--navy);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
    .hlogo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:0.04em;color:var(--white);line-height:1}
    .hlogo em{font-family:'Playfair Display',serif;font-style:italic;color:var(--gold);font-size:2rem;letter-spacing:0}
    .hsub{font-size:0.7rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-top:3px}
    .hsub b{color:var(--gold);font-weight:600}
    .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .sync-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
    .sync-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:20px;padding:7px 13px;color:var(--white);font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
    .sync-btn:hover{border-color:var(--gold)}
    .sync-btn:disabled{opacity:0.6;cursor:not-allowed}
    .sync-updated{font-size:0.58rem;color:var(--muted);letter-spacing:0.03em;padding-right:2px}
    .sdot{width:7px;height:7px;border-radius:50%;background:#22C55E;flex-shrink:0;animation:pdot 1.5s ease-in-out infinite}
    .sdot.err{background:#EF4444;animation:none}
    .sdot.spin{background:var(--gold)}
    @keyframes pdot{0%,100%{opacity:1}50%{opacity:0.4}}
    .icon-btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
    .icon-btn:hover{border-color:var(--gold);transform:scale(1.1)}

    /* NOTIF BANNER */
    #notifBanner{display:none;background:rgba(79,70,229,0.15);border-bottom:1px solid rgba(79,70,229,0.3);padding:10px 20px;text-align:center}
    #notifBtn{background:#4f46e5;color:#fff;border:none;border-radius:20px;padding:8px 20px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:6px}
    #notifBtn:hover{background:#4338ca}

    /* REMINDER BANNERS */
    #reminderBanners{position:-webkit-sticky;position:sticky;top:var(--header-h,73px);z-index:250;display:none}
    .rbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.05);animation:slideDown 0.25s ease}
    .rbanner:last-child{border-bottom:none}
    @keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    .rbanner-body{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
    .rbanner-icon{font-size:1.1rem;flex-shrink:0}
    .rbanner-text{font-size:0.78rem;font-weight:500;color:var(--white);line-height:1.4;flex:1;min-width:0}
    .rbanner-time{font-size:0.65rem;font-weight:700;background:rgba(255,255,255,0.1);padding:3px 8px;border-radius:10px;color:var(--gold);white-space:nowrap;flex-shrink:0}
    .rbanner-dismiss{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.3);font-size:1rem;padding:2px 4px;flex-shrink:0;transition:color 0.15s;font-family:'DM Sans',sans-serif;line-height:1}
    .rbanner-dismiss:hover{color:rgba(255,255,255,0.7)}

    /* STATS BAR */
    #statsBar{position:-webkit-sticky;position:sticky;top:var(--header-h,73px);z-index:200;background:var(--navy-mid);border-bottom:1px solid var(--border);padding:8px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 2px 12px rgba(0,0,0,0.4)}
    .stat{text-align:center;padding:5px 2px}
    .stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--gold);line-height:1}
    .stat-lbl{font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:1px}
    .stat-val.past{color:var(--muted)}

    /* CONTROLS */
    #controls{position:-webkit-sticky;position:sticky;top:var(--header-stats-h,163px);z-index:100;background:var(--navy);border-bottom:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.4)}
    .pstrip{padding:10px 20px 0;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
    .pstrip::-webkit-scrollbar{display:none}
    .pchip{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;font-size:0.76rem;font-weight:600;color:var(--muted);flex-shrink:0;transition:all 0.18s}
    .pchip.active{color:var(--white);border-bottom-color:var(--gold)}
    .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .vrow{padding:8px 12px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:nowrap;overflow:hidden}
    .left-controls{display:flex;align-items:center;gap:6px}
    .vbtns{display:flex;background:var(--card-bg);border-radius:8px;padding:3px;gap:2px;flex-shrink:0}
    .vbtn{padding:5px 12px;border-radius:6px;border:none;background:transparent;font-size:0.75rem;font-weight:600;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s}
    .vbtn.active{background:var(--navy-light);color:var(--gold)}
    .mnav-today{background:var(--card-bg);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:0 8px;height:28px;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;flex-shrink:0}
    .mnav-today:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}
    .btn-add-event{display:flex;align-items:center;gap:5px;background:var(--gold);color:var(--navy);border:none;border-radius:6px;padding:5px 12px;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;flex-shrink:0}
    .btn-add-event:hover{filter:brightness(1.1)}
    .mnav{display:flex;align-items:center;gap:4px;flex-shrink:0}
    .mnav-arr{background:var(--card-bg);border:1px solid var(--border);color:var(--muted);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-family:'DM Sans',sans-serif;flex-shrink:0}
    .mnav-arr:hover{border-color:var(--gold);color:var(--gold)}
    #calPeriod{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.07em;color:var(--white);min-width:100px;text-align:center;flex-shrink:1}

    /* CALENDAR CONTENT */
    main{padding:14px 20px 80px}
    .dgroup{margin-bottom:20px}
    .dlabel{font-size:0.66rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .dlabel::after{content:'';flex:1;height:1px;background:var(--border)}
    .dlabel.today{color:var(--gold)}
    .tpill{font-size:0.58rem;font-weight:700;background:var(--gold);color:var(--navy);padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:0.06em}

    /* EVENT CARDS */
    .ecard{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;transition:border-color 0.2s,transform 0.15s;cursor:pointer}
    .ecard:hover{border-color:rgba(245,197,24,0.3);transform:translateX(2px)}
    .ecard.manual{border-style:dashed;border-color:rgba(245,197,24,0.35)}
    .ecard.manual:hover{border-color:rgba(245,197,24,0.65)}
    .etime{min-width:46px;text-align:right;font-family:'DM Mono',monospace;font-size:0.68rem;font-weight:600;color:var(--muted);padding-top:2px;line-height:1.5;flex-shrink:0}
    .etime small{font-weight:400;display:block}
    .estripe{width:3px;border-radius:3px;align-self:stretch;flex-shrink:0}
    .ebody{flex:1;min-width:0}
    .etitle{font-weight:700;font-size:0.88rem;color:var(--white);margin-bottom:3px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .eloc{display:flex;align-items:center;gap:4px;color:var(--gold-dim);font-size:0.7rem;text-decoration:none;margin-top:4px;transition:color 0.15s;cursor:pointer}
    .eloc:hover{color:var(--gold)}
    .etags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
    .etag{font-size:0.6rem;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:0.04em}
    .etag-manual{font-size:0.6rem;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(245,197,24,0.12);color:var(--gold);border:1px dashed rgba(245,197,24,0.4)}

    /* CONFLICT BANNERS */
    .cbanner{border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:0.74rem;font-weight:600;display:flex;align-items:flex-start;gap:7px;flex-direction:column}
    .cbanner-red{background:rgba(220,38,38,0.1);border-left:3px solid #DC2626;color:#FCA5A5}
    .cbanner-yellow{background:rgba(234,179,8,0.1);border-left:3px solid #EAB308;color:#FDE68A}
    .cbanner-row{display:flex;align-items:center;gap:7px;font-size:0.74rem;font-weight:600}

    /* MONTH VIEW */
    .cghdr{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)}
    .cgdow{text-align:center;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);padding:7px 0}
    .cg{display:grid;grid-template-columns:repeat(7,1fr)}
    .ccell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:76px;padding:4px;cursor:pointer;transition:background 0.15s}
    .ccell:nth-child(7n){border-right:none}
    .ccell:hover{background:rgba(245,197,24,0.05)}
    .ccell.om{opacity:0.3}.ccell.tc{background:rgba(245,197,24,0.07)}
    .cnum{font-size:0.7rem;font-weight:600;color:var(--muted);margin-bottom:3px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
    .ccell.tc .cnum{background:var(--gold);color:var(--navy);font-weight:800}
    .cev{font-size:0.58rem;font-weight:600;border-radius:3px;padding:2px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
    .cev.manual-ev{border-style:dashed}
    .cmore{font-size:0.58rem;color:var(--muted);font-weight:600;padding:1px 4px}

    /* EVENT MODAL */
    .moverlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
    .moverlay.show{display:flex}
    .msheet{background:var(--navy-mid);border-radius:20px 20px 0 0;padding:16px 20px 40px;width:100%;max-width:520px;max-height:80vh;overflow-y:auto;border:1px solid var(--border)}
    .mhandle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
    .mtitle{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--white);margin-bottom:3px}
    .morg{font-size:0.74rem;color:var(--muted);font-weight:500}
    .mrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:0.82rem}
    .mrow:last-of-type{border-bottom:none}
    .mico{font-size:1.1rem;width:22px;text-align:center;flex-shrink:0}
    .mlbl{color:var(--muted);font-size:0.7rem;font-weight:500;min-width:64px}
    .mval{color:var(--white);font-weight:600;flex:1}
    .mact{width:100%;background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:13px;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:7px}
    .mcls{width:100%;background:var(--card-bg);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px}
    .mdel{width:100%;background:rgba(220,38,38,0.1);color:#FCA5A5;border:1px solid rgba(220,38,38,0.3);border-radius:10px;padding:11px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px}

    /* MAPS MODAL */
    .moverlay-maps{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:700;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
    .moverlay-maps.show{display:flex}
    .maps-sheet{background:var(--navy-mid);border-radius:20px 20px 0 0;padding:16px 20px 40px;width:100%;max-width:520px;border:1px solid var(--border)}
    .maps-title{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);text-align:center;margin-bottom:14px}
    .maps-loc{font-size:0.82rem;font-weight:600;color:var(--white);text-align:center;margin-bottom:16px;padding:0 12px;line-height:1.4}
    .maps-btn{width:100%;display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:8px;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;transition:border-color 0.18s}
    .maps-btn:hover{border-color:rgba(245,197,24,0.35)}
    .maps-btn-ico{font-size:1.4rem;width:28px;text-align:center;flex-shrink:0}
    .maps-btn-label{flex:1;text-align:left}
    .maps-btn-name{font-size:0.85rem;font-weight:700;color:var(--white);display:block}
    .maps-btn-sub{font-size:0.68rem;color:var(--muted);display:block;margin-top:1px}
    .maps-cls{width:100%;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px}

    /* THEME MODAL */
    .moverlay-theme{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:800;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
    .moverlay-theme.show{display:flex}
    .theme-sheet{background:var(--navy-mid);border-radius:20px 20px 0 0;padding:16px 20px 40px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;border:1px solid var(--border)}
    .theme-title{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);text-align:center;margin-bottom:16px}
    .theme-preview{border-radius:var(--radius);overflow:hidden;margin-bottom:20px;border:1px solid var(--border)}
    .preview-header{background:var(--navy);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
    .preview-logo{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--white)}
    .preview-logo span{color:var(--gold)}
    .preview-dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
    .preview-card{background:var(--card-bg);margin:8px;border-radius:8px;padding:10px 12px;border:1px solid var(--border);display:flex;gap:8px;align-items:center}
    .preview-stripe{width:3px;height:32px;border-radius:3px;background:var(--gold);flex-shrink:0}
    .preview-text{font-size:0.75rem;color:var(--white);font-weight:600}
    .preview-tag{font-size:0.55rem;font-weight:700;padding:2px 6px;border-radius:8px;background:rgba(245,197,24,0.15);color:var(--gold);margin-top:3px;display:inline-block}
    .theme-section{margin-bottom:20px}
    .theme-section-label{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:10px}
    .color-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .color-label{font-size:0.8rem;font-weight:600;color:var(--white);min-width:80px;flex-shrink:0}
    .color-input-wrap{position:relative;flex-shrink:0}
    .color-swatch{width:36px;height:36px;border-radius:8px;border:2px solid rgba(255,255,255,0.2);cursor:pointer;transition:transform 0.15s}
    .color-swatch:hover{transform:scale(1.1)}
    input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0}
    .color-hex{flex:1;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:0.78rem;font-weight:600;color:var(--white);font-family:'DM Mono',monospace;text-transform:uppercase}
    .color-hex:focus{outline:none;border-color:var(--gold)}
    .palette-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;max-height:160px;overflow-y:auto;padding:4px 2px}
    .palette-swatch{width:26px;height:26px;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:all 0.15s;flex-shrink:0}
    .palette-swatch:hover{transform:scale(1.2);border-color:rgba(255,255,255,0.6);z-index:1;position:relative}
    .palette-swatch.selected{border-color:var(--white);transform:scale(1.15);box-shadow:0 0 0 1px var(--white)}
    .theme-save{width:100%;background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:13px;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:7px}
    .theme-reset{width:100%;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:0.82rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px}
    .theme-cls{width:100%;background:var(--card-bg);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:0.82rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px}

    /* ADD EVENT MODAL */
    .ae-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:600;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
    .ae-overlay.show{display:flex}
    .ae-sheet{background:var(--navy-mid);border-radius:20px 20px 0 0;padding:16px 20px 40px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border:1px solid var(--border)}
    .ae-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
    .ae-title{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--white);margin-bottom:16px}
    .ae-field{margin-bottom:12px}
    .ae-label{font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:5px;display:block}
    .ae-input{width:100%;padding:9px 12px;font-size:0.88rem;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:8px;color:var(--white);outline:none;transition:border-color 0.2s}
    .ae-input:focus{border-color:var(--gold)}
    .ae-input option{background:var(--navy-mid)}
    .ae-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .ae-cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .ae-cat{padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:0.72rem;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.2s}
    .ae-cat.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}
    .ae-repeat{display:flex;gap:6px;margin-top:4px}
    .ae-rep{padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:0.72rem;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.2s}
    .ae-rep.active{background:rgba(245,197,24,0.15);color:var(--gold);border-color:var(--gold)}

<script>
const SURL = 'https://urwnbskrtoplgnkkxuvl.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyd25ic2tydG9wbGdua2t4dXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDgyMjMsImV4cCI6MjA5NDYyNDIyM30._BpvQsf6Ub5nwxY8jD3aGDLvyk0-_vBA4s6LREZ9ShQ';
const REFRESH = 5 * 60 * 1000;
const COLORS = ['#F97316','#0EA5E9','#22C55E','#A855F7','#EF4444','#F59E0B','#06B6D4','#EC4899','#14B8A6','#F43F5E'];
const CAT_COLORS = {family:'#F5C518',school:'#0EA5E9',dance:'#EC4899',religion:'#8B5CF6',medical:'#EF4444',other:'#94A3B8'};
const CAT_LABELS = {family:'🏠 Family',school:'🏫 School',dance:'💃 Dance',religion:'✝️ Religion',medical:'🏥 Medical',other:'📦 Other'};

const sb = window.supabase.createClient(SURL, SKEY);
const params = new URLSearchParams(window.location.search);
const familyEmail = params.get('email');
const familyId = params.get('id');
const familyPhone = params.get('phone');
const memberName = params.get('member') || '';
const memberRole = params.get('role') || 'parent';

let allEvents = [], platformMap = {}, activeKey = 'all';
let currentView = 'list', currentDate = new Date(), lastLoad = null;
let familyLabel = 'Your';
let isSyncing = false;
let canAddEvents = false;
let currentFamilyId = null;
let aeCategory = 'family';
let aeRepeat = 'none';
let aeKid = 'Family';
let familyMembers = [];

// ── STICKY ────────────────────────────────────────────────
function applySticky() {
  const hh = document.getElementById('siteHeader').getBoundingClientRect().height;
  const nb = document.getElementById('notifBanner');
  const nbH = (nb.style.display !== 'none') ? nb.getBoundingClientRect().height : 0;
  const rb = document.getElementById('reminderBanners');
  const rbH = (rb.style.display !== 'none') ? rb.getBoundingClientRect().height : 0;
  const sh = document.getElementById('statsBar').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--header-h', hh + 'px');
  nb.style.top = hh + 'px';
  rb.style.top = (hh + nbH) + 'px';
  document.getElementById('statsBar').style.top = (hh + nbH + rbH) + 'px';
  document.documentElement.style.setProperty('--header-stats-h', (hh + nbH + rbH + sh) + 'px');
  document.getElementById('controls').style.top = (hh + nbH + rbH + sh) + 'px';
}
const sObs = new ResizeObserver(applySticky);
sObs.observe(document.getElementById('siteHeader'));
sObs.observe(document.getElementById('statsBar'));
sObs.observe(document.getElementById('reminderBanners'));
sObs.observe(document.getElementById('notifBanner'));
applySticky();
window.addEventListener('orientationchange', function(){ setTimeout(applySticky, 100); });

// ── PERMISSION CHECK ──────────────────────────────────────
function checkAddEventPermission() {
  if (memberRole === 'player') {
    canAddEvents = false;
    checkPlayerAddPermission();
  } else {
    canAddEvents = true;
    document.getElementById('addEventBtn').style.display = 'flex';
  }
}

async function checkPlayerAddPermission() {
  if (!familyEmail || !memberName) return;
  try {
    const res = await fetch(SURL + '/rest/v1/family_members?name=eq.' + encodeURIComponent(memberName) + '&select=can_add_events&limit=1', {
      headers: { 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY }
    });
    const data = await res.json();
    if (data && data.length && data[0].can_add_events) {
      canAddEvents = true;
      document.getElementById('addEventBtn').style.display = 'flex';
    }
  } catch(e) {}
}

// ── MANUAL SYNC ───────────────────────────────────────────
async function manualSync() {
  if (isSyncing) return;
  isSyncing = true;
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  setSync('spin', 'Syncing...');
  try {
    await fetch(SURL + '/functions/v1/sync-schedules', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY },
      body: JSON.stringify({ email: familyEmail || null })
    });
  } catch(e) {}
  setTimeout(async function() {
    // Clear only sports events, keep manual events during sync
    allEvents = allEvents.filter(function(e){ return e.isManual; });
    await loadEvents(false);
    // loadFamilyEvents already called inside processSportsEvents via allEvents merge
    setSync('ok', 'Synced');
    showToast('Schedule synced — ' + allEvents.length + ' events loaded');
    btn.disabled = false;
    isSyncing = false;
  }, 3000);
}

// ── PUSH NOTIFICATIONS ────────────────────────────────────
const VAPID_PUBLIC = 'EKJUeAsR-r7LlfWI88pKcATtN07J9iAx6GBwuKCZT5N7GrzyxH3XYn_9H2FusaIv64NOwaeAs_ctuaCc90uFwA';
function urlBase64ToUint8Array(b) { const p='='.repeat((4-b.length%4)%4); const b64=(b+p).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(b64); return Uint8Array.from([...raw].map(function(c){return c.charCodeAt(0);})); }
async function savePushSub(sub) { if(!familyEmail)return; try{const j=sub.toJSON();await sb.from('push_subscriptions').upsert({email:familyEmail,endpoint:j.endpoint,keys:j.keys},{onConflict:'email,endpoint'});showToast('Notifications enabled!');}catch(e){} }
async function initPush() {
  if(!familyEmail||!('serviceWorker' in navigator)||!('PushManager' in window))return;
  try {
    const reg=await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const perm=Notification.permission;
    if(perm==='granted'){const ex=await reg.pushManager.getSubscription();if(ex){await savePushSub(ex);}else{const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});await savePushSub(s);}document.getElementById('notifBanner').style.display='none';}
    else if(perm==='default'){document.getElementById('notifBanner').style.display='block';applySticky();}
    else{document.getElementById('notifBanner').style.display='none';}
  }catch(e){}
}
async function requestNotifPermission() {
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
  try{const reg=await navigator.serviceWorker.ready;const p=await Notification.requestPermission();if(p==='granted'){document.getElementById('notifBanner').style.display='none';applySticky();const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});await savePushSub(s);}else{showToast('Notifications blocked — enable in Settings');}}catch(e){}
}

// ── REMINDERS ─────────────────────────────────────────────
const DKEY = 'hh_dismissed_' + (familyEmail || 'x');
let dismissedIds = new Set(JSON.parse(localStorage.getItem(DKEY) || '[]'));
async function loadReminders() {
  if(!familyEmail)return;
  try{const today=new Date().toISOString().slice(0,10);const{data}=await sb.from('reminders').select('id,kid,message,event_time,event_name,dismissed').eq('email',familyEmail).eq('event_date',today).eq('dismissed',false);if(!data)return;renderBanners(data.filter(function(r){return!dismissedIds.has(r.id);}));}catch(e){}
}
function bannerIcon(msg){const m=msg.toLowerCase();if(m.includes('tournament'))return'&#x1F947;';if(m.includes('game'))return'&#x1F3C6;';if(m.includes('practice'))return'&#x26BD;';return'&#x1F4C5;';}
function renderBanners(reminders){
  const wrap=document.getElementById('reminderBanners');
  if(!reminders.length){wrap.style.display='none';applySticky();return;}
  const gold=getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#F5C518';
  const rgb=hexToRgb(gold);const tint='rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.11)';
  wrap.innerHTML=reminders.map(function(r){return'<div class="rbanner" id="rbanner-'+r.id+'" style="background:'+tint+'"><div class="rbanner-body"><div class="rbanner-icon">'+bannerIcon(r.message)+'</div><div class="rbanner-text">'+esc(r.message)+'</div></div>'+(r.event_time?'<div class="rbanner-time">'+esc(r.event_time)+'</div>':'')+'<button class="rbanner-dismiss" onclick="dismissBanner(\''+r.id+'\')" title="Dismiss">&times;</button></div>';}).join('');
  wrap.style.display='block';applySticky();
}
async function dismissBanner(id){const el=document.getElementById('rbanner-'+id);if(el){el.style.transition='opacity 0.2s';el.style.opacity='0';setTimeout(function(){el.remove();if(!document.getElementById('reminderBanners').children.length){document.getElementById('reminderBanners').style.display='none';applySticky();}},220);}dismissedIds.add(id);localStorage.setItem(DKEY,JSON.stringify([...dismissedIds]));try{await sb.from('reminders').update({dismissed:true}).eq('id',id);}catch(e){}}

// ── LOAD SPORTS EVENTS ────────────────────────────────────
async function loadEvents(showToastMsg) {
  try {
    let feedQ = sb.from('feeds').select('*').eq('is_active', true);
    if (familyEmail) feedQ = feedQ.eq('email', familyEmail);
    else if (familyId) feedQ = feedQ.eq('id', familyId);
    else if (familyPhone) feedQ = feedQ.eq('phone', familyPhone);
    const { data: feeds, error: feedErr } = await feedQ;
    if (feedErr || !feeds || !feeds.length) { showNoFamily(); return; }

    platformMap = {};
    const seen = new Set();
    feeds.forEach(function(f) {
      const key = f.id || ((f.platform||'cal')+'::' +(f.kid_name||'')+'::' +(f.team_name||''));
      if (seen.has(key)) return;
      seen.add(key);
      // Use stable hash of key so colors don't shuffle on every sync
      var hash = 0; for (var ci = 0; ci < key.length; ci++) { hash = ((hash << 5) - hash) + key.charCodeAt(ci); hash |= 0; }
      var colorIndex = Math.abs(hash) % COLORS.length;
      platformMap[key] = { label: f.team_name || (f.kid_name ? f.kid_name + (f.sport ? ' · ' + f.sport : '') : (f.platform || 'Calendar')), color: COLORS[colorIndex], kidName: f.kid_name || '', sport: f.sport || '', platform: f.platform || '', teamName: f.team_name || '' };
    });

    const fname = feeds[0].family_name || '';
    familyLabel = fname ? fname + "'s" : (feeds[0].kid_name ? feeds[0].kid_name + "'s" : 'Your');
    document.getElementById('headerSub').innerHTML = familyLabel + ' schedule &middot; powered by <b>Venuewise</b>';
    document.title = 'HomeHuddle · ' + familyLabel + ' Schedule';
    buildPlatformStrip();

    const now = new Date();
    const start = new Date(now.getTime() - 30 * 864e5);
    const end = new Date(now.getTime() + 365 * 864e5);
    const phones = [...new Set(feeds.map(function(f){ return f.phone; }).filter(Boolean))];
    const kids = [...new Set(feeds.map(function(f){ return f.kid_name; }).filter(Boolean))];

    let evQ = sb.from('events').select('*').gte('start', start.toISOString()).lte('start', end.toISOString()).eq('is_duplicate', false).order('start', { ascending: true });
    if (phones.length) evQ = evQ.in('family_phone', phones);
    else if (kids.length) evQ = evQ.in('kid', kids);

    const { data, error } = await evQ;
    if (error) throw error;
    processSportsEvents(data || [], feeds);
  } catch(err) {
    console.error(err);
    setSync('err', 'Error');
    document.getElementById('calContent').innerHTML = '<div class="smsg"><div class="ico">&#x26A0;&#xFE0F;</div><h3>Could not load</h3><p>' + esc(err.message) + '<br><br><a href="javascript:loadEvents(false)">Try again</a></p></div>';
  }
}

function processSportsEvents(data, feeds) {
  lastLoad = new Date();
  const sportsEvents = data.map(function(row) {
    const mf = (row.feed_id ? feeds.find(function(f){ return f.id === row.feed_id; }) : null)
      || feeds.find(function(f){ return f.kid_name && f.kid_name === row.kid && f.team_name && row.team_name && f.team_name === row.team_name; })
      || feeds.find(function(f){ return f.kid_name && f.kid_name === row.kid && f.platform && f.platform === row.platform; })
      || feeds.find(function(f){ return f.kid_name && f.kid_name === row.kid; }) || feeds[0];
    const pmKey = mf ? (mf.id || ((mf.platform||'cal')+'::' +(mf.kid_name||'')+'::' +(mf.team_name||''))) : null;
    const pm = pmKey && platformMap[pmKey];
    return {
      id: row.uid || row.id, name: row.name || row.title || 'Event',
      kid: row.kid || '', platform: row.platform || '', sport: row.sport || '',
      team_name: row.team_name || '', feed_id: row.feed_id || '',
      start: new Date(row.start || row.start_time), end: new Date(row.end || row.end_time),
      location: row.location || '', description: row.description || '',
      conflict: row.conflict || false, pmKey: pmKey || 'all',
      color: pm ? pm.color : COLORS[0],
      pmLabel: pm ? pm.label : (row.team_name || row.platform || ''),
      isManual: false
    };
  }).filter(function(e){ return !isNaN(e.start); });

  // Keep manual events, replace sports events
  const manualOnly = allEvents.filter(function(e){ return e.isManual; });
  allEvents = sportsEvents.concat(manualOnly).sort(function(a,b){ return a.start - b.start; });
  // Always reload family events after sports to keep manual events fresh
  loadFamilyEvents();

  // Detect conflicts with player awareness
  detectConflicts();
  applySticky(); updateStats(); render(); setSync('ok', 'Synced');
}

// ── LOAD FAMILY ID ────────────────────────────────────────
async function loadFamilyId() {
  if (currentFamilyId || !familyEmail) return;
  try {
    const res = await fetch(SURL + '/rest/v1/families?email=eq.' + encodeURIComponent(familyEmail) + '&select=id&limit=1', {
      headers: { 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY }
    });
    const data = await res.json();
    if (data && data.length && data[0].id) currentFamilyId = data[0].id;
  } catch(e) { console.log('loadFamilyId error:', e); }
}

// ── LOAD FAMILY (MANUAL) EVENTS ───────────────────────────
async function loadFamilyEvents() {
  if (!familyEmail) return;
  try {
    const now = new Date();
    const start = new Date(now.getTime() - 30 * 864e5).toISOString();
    const end = new Date(now.getTime() + 365 * 864e5).toISOString();

    // Use the family_events_by_email view — queries directly by email, no family ID needed
    const evUrl = SURL + '/rest/v1/family_events_by_email?order=event_start.asc';
    const evRes = await fetch(evUrl, {
      headers: { 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY }
    });
    const evData = await evRes.json();
    showToast('Family events: ' + (evData ? evData.length : 'null') + ' found');
    if (!evData || !evData.length) return;

    // Also set currentFamilyId for saving new events
    if (evData[0] && evData[0].family_id) currentFamilyId = evData[0].family_id;

    const manualEvents = evData.map(function(e) {
      return {
        id: e.id, name: e.title,
        start: new Date(e.event_start), end: new Date(e.event_end || e.event_start),
        location: e.location || '', sport: e.category || 'family',
        kid: (e.applies_to && e.applies_to.length ? e.applies_to[0] : 'Family'), platform: 'manual', team_name: '',
        color: e.color || CAT_COLORS[e.category] || '#F5C518',
        pmLabel: CAT_LABELS[e.category] || '🏠 Family',
        pmKey: 'manual', conflict: false, isManual: true,
        notes: e.notes || '', category: e.category || 'family'
      };
    });

    // Remove old manual events (from DB) and add fresh ones, keep locally added ones
    allEvents = allEvents.filter(function(e){ return !e.isManual; }).concat(manualEvents).sort(function(a,b){ return a.start - b.start; });
    // Set currentFamilyId if not already set
    if (!currentFamilyId && manualEvents.length && manualEvents[0].family_id) currentFamilyId = manualEvents[0].family_id;
    detectConflicts();
    updateStats(); render();
  } catch(e) { console.log('Family events error:', e); }
}

// ── CONFLICT DETECTION ────────────────────────────────────
function detectConflicts() {
  // Group events by date
  const byDate = {};
  allEvents.forEach(function(e) {
    const dk = e.start.toDateString();
    if (!byDate[dk]) byDate[dk] = [];
    byDate[dk].push(e);
  });

  allEvents.forEach(function(e){ e.conflicts = []; });

  Object.values(byDate).forEach(function(dayEvents) {
    for (let i = 0; i < dayEvents.length; i++) {
      for (let j = i + 1; j < dayEvents.length; j++) {
        const a = dayEvents[i], b = dayEvents[j];
        if (a.start < b.end && a.end > b.start) {
          const sameKid = a.kid && b.kid && a.kid !== 'Family' && b.kid !== 'Family' && a.kid === b.kid;
          const type = sameKid ? 'red' : 'yellow';
          a.conflicts.push({ withId: String(b.id), withName: b.name, withKid: b.kid||'Family', withStart: b.start.toISOString(), type: type });
          b.conflicts.push({ withId: String(a.id), withName: a.name, withKid: a.kid||'Family', withStart: a.start.toISOString(), type: type });
        }
      }
    }
  });
}

function updateStats() {
  const now = new Date(), dow = now.getDay();
  const weekEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (6 - dow), 23, 59, 59);
  const evts = filtered();

  document.getElementById('stTotal').textContent = upcoming.length;
  document.getElementById('stWeek').textContent = evts.filter(function(e){ return e.start >= now && e.start <= weekEnd; }).length;
  const seenPairs = new Set();
evts.forEach(function(e){ (e.conflicts||[]).forEach(function(c){ var pair = [String(e.id), c.withId].sort().join('|'); seenPairs.add(pair); }); });
document.getElementById('stConfl').textContent = seenPairs.size;
  document.getElementById('stPast').textContent = evts.filter(function(e){ return e.start < now; }).length;

          }

function renderMonth() {

function dlICS(evId) {

  const fmt = function(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z'; };
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HomeHuddle//EN','BEGIN:VEVENT','UID:' + ev.id + '@homehuddle','DTSTART:' + fmt(new Date(ev.start)),'DTEND:' + fmt(new Date(ev.end)),'SUMMARY:' + ev.name,'LOCATION:' + (ev.location || ''),'DESCRIPTION:' + ev.kid + ' - ' + ev.sport + ' - via HomeHuddle','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })), download: (ev.name.replace(/[^a-z0-9]/gi,'_') || 'event') + '.ics' });

  showToast('Open the .ics file to add to your calendar');

function checkAEConflict() {
  const date = document.getElementById('aeDate').value;
  const startT = document.getElementById('aeStart').value;
  const wrap = document.getElementById('aeConflictWrap');
  if (!date || !startT) { wrap.innerHTML = ''; return; }
  const newStart = new Date(date + 'T' + startT);
  const endT = document.getElementById('aeEnd').value;
  const newEnd = endT ? new Date(date + 'T' + endT) : new Date(newStart.getTime() + 3600000);
  const conflicts = allEvents.filter(function(e){ return e.start.toDateString() === newStart.toDateString() && e.start < newEnd && e.end > newStart; });
  if (!conflicts.length) { wrap.innerHTML = ''; return; }
  let html = '';
  const seen = new Set();
  conflicts.forEach(function(c) {
    if (seen.has(c.id)) return; seen.add(c.id);
    const kidLabel = c.kid || (c.isManual ? 'Family' : 'Family');
    const isRed = aeKid !== 'Family' && c.kid === aeKid;
    html += '<div class="ae-conflict-item ' + (isRed ? 'ae-conflict-red' : 'ae-conflict-yellow') + '">' + (isRed ? '🔴' : '🟡') + ' ' + esc(kidLabel) + ' has <strong>' + esc(c.name) + '</strong> at ' + fmtT(c.start) + ' — you can still save</div>';
  });
  wrap.innerHTML = html;
}

async function saveAE() {
  const title = document.getElementById('aeTitle').value.trim();
  const date = document.getElementById('aeDate').value;
  const startT = document.getElementById('aeStart').value;
  const endT = document.getElementById('aeEnd').value;
  const loc = document.getElementById('aeLoc').value.trim();
  const notes = document.getElementById('aeNotes').value.trim();
  const repEnd = document.getElementById('aeRepEnd').value;
  if (!title) return showToast('Please enter an event title');
  if (!date) return showToast('Please select a date');
  const eventStart = startT ? new Date(date + 'T' + startT).toISOString() : new Date(date + 'T00:00:00').toISOString();
  const eventEnd = endT ? new Date(date + 'T' + endT).toISOString() : new Date(date + 'T23:59:00').toISOString();
  // Clean up any orphaned local copies from previous failed attempts
  allEvents = allEvents.filter(function(e){ return !(e.isManual && e.name === title && String(e.id).startsWith('manual-temp')); });

  const payload = { family_id: currentFamilyId, title: title, event_start: eventStart, event_end: eventEnd, location: loc || null, category: aeCategory, color: CAT_COLORS[aeCategory] || '#F5C518', notes: notes || null, repeat_type: aeRepeat, repeat_end_date: repEnd || null, applies_to: aeKid === 'Family' ? [] : [aeKid], created_by: null };

  // Disable save button to prevent double-submit
  const saveBtn = document.querySelector('.ae-save');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '💾 Saving...'; }

  try {
    const res = await fetch(SURL + '/rest/v1/family_events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY, 'Prefer': 'return=representation' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const errData = await res.json().catch(function(){ return {}; });
      throw new Error(errData.message || 'Save failed (' + res.status + ')');
    }
    const saved = await res.json();
    const savedId = Array.isArray(saved) ? saved[0].id : saved.id;
    const newEv = { id: savedId, name: title, start: new Date(eventStart), end: new Date(eventEnd), location: loc, sport: aeCategory, kid: aeKid, platform: 'manual', team_name: '', color: CAT_COLORS[aeCategory] || '#F5C518', pmLabel: CAT_LABELS[aeCategory] || '🏠 Family', pmKey: 'manual', conflict: false, isManual: true, notes: notes, conflicts: [] };

    // Only add to local array AFTER confirmed save
    allEvents.push(newEv);

    if (aeRepeat !== 'none' && repEnd) {
      const endDate = new Date(repEnd);
      const duration = new Date(eventEnd) - new Date(eventStart);
      let cur = new Date(eventStart);
      if (aeRepeat === 'weekly') cur.setDate(cur.getDate() + 7);
      else cur.setMonth(cur.getMonth() + 1);
      while (cur <= endDate) {
        const rp = Object.assign({}, payload, { event_start: cur.toISOString(), event_end: new Date(cur.getTime() + duration).toISOString() });
        const rRes = await fetch(SURL + '/rest/v1/family_events', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY, 'Prefer': 'return=representation' }, body: JSON.stringify(rp) });
        const rSaved = await rRes.json();
        allEvents.push(Object.assign({}, newEv, { id: Array.isArray(rSaved) ? rSaved[0].id : rSaved.id, start: new Date(cur), end: new Date(cur.getTime() + duration), conflicts: [] }));
        if (aeRepeat === 'weekly') cur.setDate(cur.getDate() + 7);
        else cur.setMonth(cur.getMonth() + 1);
      }
    }

    allEvents.sort(function(a,b){ return a.start - b.start; });
    detectConflicts();
    buildPlatformStrip();
    closeAE(); render(); updateStats();
    showToast('✅ "' + title + '" added to your calendar');
  } catch(e) {
    console.error('Save error:', e);
    showToast('Could not save: ' + (e.message || 'try again'));
  } finally {
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '💾 Save Event'; }
  }
}

function hexToRgb(hex){return{r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};}
function hexToRgba(hex,alpha){const c=hexToRgb(hex);return'rgba('+c.r+','+c.g+','+c.b+','+alpha+')';}
function adjustColor(hex,factor){const c=hexToRgb(hex);const adj=function(v){return Math.min(255,Math.max(0,Math.round(v*factor)));};return'#'+[adj(c.r),adj(c.g),adj(c.b)].map(function(v){return v.toString(16).padStart(2,'0');}).join('');}
function applyTheme(theme){const root=document.documentElement;root.style.setProperty('--navy',theme.base);root.style.setProperty('--navy-mid',theme.mid||adjustColor(theme.base,1.3));root.style.setProperty('--navy-light',theme.light||adjustColor(theme.base,1.6));root.style.setProperty('--card-bg',theme.card);root.style.setProperty('--gold',theme.accent);root.style.setProperty('--gold-dim',adjustColor(theme.accent,0.75));root.style.setProperty('--border',hexToRgba(theme.accent,0.12));root.style.setProperty('--white',theme.white||'#F0F4FF');root.style.setProperty('--muted',theme.muted||'#7A8FAD');currentTheme=Object.assign({},theme);}
async function loadTheme(){if(!familyEmail)return;try{const{data}=await sb.from('feeds').select('theme').eq('email',familyEmail).limit(1).single();if(data&&data.theme)applyTheme(data.theme);}catch(e){}}
async function saveTheme(){if(!familyEmail){showToast('Sign in to save your theme');return;}try{await sb.from('feeds').update({theme:currentTheme}).eq('email',familyEmail);showToast('Theme saved');closeTheme();}catch(e){showToast('Could not save theme');}}
function openTheme(){const t=currentTheme;document.getElementById('themeContent').innerHTML='<div class="mhandle"></div><div class="theme-title">Customize Your Calendar</div><div class="theme-preview"><div class="preview-header"><div class="preview-logo">Home<span>Huddle</span></div><div class="preview-dot"></div></div><div class="preview-card"><div class="preview-stripe"></div><div><div class="preview-text">Sample Event &middot; 4:00PM</div><div class="preview-tag">Your Team</div></div></div></div><div class="theme-section"><div class="theme-section-label">Background Color</div><div class="palette-row" id="basePalette"></div><div class="color-row"><div class="color-label">Base</div><div class="color-input-wrap"><div class="color-swatch" id="baseSwatchDisplay" style="background:'+t.base+'"></div><input type="color" id="basePicker" value="'+t.base+'" oninput="onColorInput(\'base\',this.value)"/></div><input class="color-hex" id="baseHex" value="'+t.base+'" maxlength="7" oninput="onHexInput(\'base\',this.value)" onblur="onHexBlur(\'base\',this.value)"/></div></div><div class="theme-section"><div class="theme-section-label">Accent Color</div><div class="palette-row" id="accentPalette"></div><div class="color-row"><div class="color-label">Accent</div><div class="color-input-wrap"><div class="color-swatch" id="accentSwatchDisplay" style="background:'+t.accent+'"></div><input type="color" id="accentPicker" value="'+t.accent+'" oninput="onColorInput(\'accent\',this.value)"/></div><input class="color-hex" id="accentHex" value="'+t.accent+'" maxlength="7" oninput="onHexInput(\'accent\',this.value)" onblur="onHexBlur(\'accent\',this.value)"/></div></div><div class="theme-section"><div class="theme-section-label">Card Color</div><div class="palette-row" id="cardPalette"></div><div class="color-row"><div class="color-label">Cards</div><div class="color-input-wrap"><div class="color-swatch" id="cardSwatchDisplay" style="background:'+t.card+'"></div><input type="color" id="cardPicker" value="'+t.card+'" oninput="onColorInput(\'card\',this.value)"/></div><input class="color-hex" id="cardHex" value="'+t.card+'" maxlength="7" oninput="onHexInput(\'card\',this.value)" onblur="onHexBlur(\'card\',this.value)"/></div></div><button class="theme-save" onclick="saveTheme()">Save My Theme</button><button class="theme-reset" onclick="resetTheme()">Reset to Default</button><button class="theme-cls" onclick="closeTheme()">Cancel</button>';
buildPalette('basePalette',ALL_COLORS,'base',currentTheme.base);buildPalette('accentPalette',ALL_COLORS,'accent',currentTheme.accent);buildPalette('cardPalette',ALL_COLORS,'card',currentTheme.card);document.getElementById('themeModal').classList.add('show');}
function buildPalette(id,colors,type,current){const el=document.getElementById(id);if(!el)return;el.innerHTML=colors.map(function(c){return'<div class="palette-swatch'+(c.toLowerCase()===current.toLowerCase()?' selected':'')+'" style="background:'+c+'" onclick="onColorInput(\''+type+'\',\''+c+'\')" title="'+c+'"></div>';}).join('');}
function onColorInput(type,value){if(!/^#[0-9A-Fa-f]{6}$/.test(value))return;if(type==='base'){currentTheme.base=value;currentTheme.mid=adjustColor(value,1.3);currentTheme.light=adjustColor(value,1.6);}else if(type==='accent')currentTheme.accent=value;else if(type==='card')currentTheme.card=value;applyTheme(currentTheme);const picker=document.getElementById(type+'Picker'),hex=document.getElementById(type+'Hex'),swatch=document.getElementById(type+'SwatchDisplay');if(picker)picker.value=value;if(hex)hex.value=value.toUpperCase();if(swatch)swatch.style.background=value;const palMap={base:'basePalette',accent:'accentPalette',card:'cardPalette'};const pal=document.getElementById(palMap[type]);if(pal)pal.querySelectorAll('.palette-swatch').forEach(function(s){s.classList.toggle('selected',s.title.toLowerCase()===value.toLowerCase());});}
function onHexInput(type,value){const clean=value.startsWith('#')?value:'#'+value;if(/^#[0-9A-Fa-f]{6}$/.test(clean))onColorInput(type,clean);}
function onHexBlur(type,value){const clean=value.startsWith('#')?value:'#'+value;if(!/^#[0-9A-Fa-f]{6}$/.test(clean)){const hex=document.getElementById(type+'Hex');if(hex)hex.value=currentTheme[type].toUpperCase();}}
function resetTheme(){applyTheme(DEFAULT_THEME);closeTheme();setTimeout(openTheme,150);showToast('Theme reset to default');}
function closeTheme(){document.getElementById('themeModal').classList.remove('show');}

function fmtT(d){const h=d.getHours(),m=d.getMinutes();return(h%12||12)+(m?':'+String(m).padStart(2,'0'):'')+(h>=12?'PM':'AM');}
function safeJSON(e){
  var safe={id:e.id,name:e.name,kid:e.kid||'',start:e.start,end:e.end,location:e.location||'',sport:e.sport||'',team_name:e.team_name||'',color:e.color,pmLabel:e.pmLabel||'',pmKey:e.pmKey||'',isManual:!!e.isManual,notes:e.notes||'',description:e.description||'',platform:e.platform||'',conflicts:(e.conflicts||[]).map(function(c){return{withId:c.withId,withName:c.withName,withKid:c.withKid,withStart:c.withStart,type:c.type};})};
  return JSON.stringify(safe);
}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
