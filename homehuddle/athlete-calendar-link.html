<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Calendar Events — AthleteHuddle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0a1628; --navy-2: #0f2044; --blue: #1e4fd8; --blue-lt: #3b6ff5;
      --gold: #f5a623; --white: #ffffff; --green: #22c55e; --orange: #f59e0b;
      --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09); --radius: 12px;
    }
    body { font-family:'DM Sans',sans-serif; background:var(--navy); color:var(--white); min-height:100vh; }
    nav {
      background:rgba(10,22,40,0.95); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border); padding:0 24px; height:60px;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:50;
    }
    .nav-brand { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px; }
    .nav-brand span { color:var(--gold); }
    .nav-back { color:rgba(255,255,255,0.6); font-size:14px; text-decoration:none; }
    .nav-back:hover { color:var(--white); }

    .page { max-width:800px; margin:0 auto; padding:32px 24px 60px; }
    .page-header { margin-bottom:28px; }
    .page-header h1 { font-family:'Barlow Condensed',sans-serif; font-size:2rem; font-weight:900; margin-bottom:6px; }
    .page-header p { font-size:14px; color:rgba(255,255,255,0.5); }

    /* ATHLETE SELECTOR */
    .athlete-selector {
      display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px;
    }
    .athlete-chip {
      display:flex; align-items:center; gap:8px;
      background:var(--surface); border:2px solid var(--border);
      border-radius:100px; padding:8px 16px;
      cursor:pointer; transition:border-color 0.2s, background 0.2s;
    }
    .athlete-chip:hover { border-color:rgba(59,111,245,0.4); }
    .athlete-chip.selected { border-color:var(--blue-lt); background:rgba(30,79,216,0.2); }
    .chip-avatar {
      width:28px; height:28px; border-radius:50%;
      background:rgba(30,79,216,0.3);
      display:flex; align-items:center; justify-content:center;
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:12px; color:var(--gold);
    }
    .chip-name { font-size:14px; font-weight:600; }

    /* EVENTS LIST */
    .events-section { margin-bottom:24px; }
    .section-title {
      font-family:'Barlow Condensed',sans-serif; font-size:1.1rem; font-weight:800;
      color:var(--gold); margin-bottom:14px; letter-spacing:0.5px;
    }

    .event-row {
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:16px 18px; margin-bottom:10px;
      display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    }
    .event-row-left { flex:1; min-width:180px; }
    .event-row-title { font-size:15px; font-weight:600; margin-bottom:4px; }
    .event-row-meta { font-size:12px; color:rgba(255,255,255,0.45); }
    .event-row-right { display:flex; flex-direction:column; gap:8px; min-width:200px; }

    .assign-label { font-size:11px; font-weight:700; color:rgba(255,255,255,0.4); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:4px; }
    .assign-chips { display:flex; gap:6px; flex-wrap:wrap; }
    .assign-chip {
      padding:4px 12px; border-radius:100px; font-size:12px; font-weight:700;
      cursor:pointer; transition:background 0.15s;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
      color:rgba(255,255,255,0.5);
    }
    .assign-chip.assigned {
      background:rgba(30,79,216,0.25); border-color:rgba(59,111,245,0.5); color:#93b4ff;
    }
    .assign-chip.family {
      background:rgba(245,166,35,0.15); border-color:rgba(245,166,35,0.3); color:var(--gold);
    }

    .btn-save-all {
      background:linear-gradient(135deg,var(--blue),var(--blue-lt));
      color:var(--white); padding:13px 28px; border-radius:8px;
      font-size:15px; font-weight:700; border:none; cursor:pointer;
      box-shadow:0 3px 16px rgba(30,79,216,0.4);
      transition:transform 0.2s;
    }
    .btn-save-all:hover { transform:translateY(-1px); }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">Athlete<span>Huddle</span></div>
  <a href="athlete-dashboard.html" class="nav-back">← Dashboard</a>
</nav>

<div class="page">
  <div class="page-header">
    <h1>📅 Link Calendar Events</h1>
    <p>Assign HomeHuddle calendar events to specific athletes or mark them as family events.</p>
  </div>

  <!-- LEGEND -->
  <div style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:24px;font-size:13px;color:rgba(255,255,255,0.5);">
    Click the athlete name buttons on each event to assign it. Events can be assigned to one athlete, multiple athletes, or the whole family.
  </div>

  <div class="events-section">
    <div class="section-title">THIS WEEK</div>
    <div id="events-list"></div>
  </div>

  <div class="events-section">
    <div class="section-title">UPCOMING</div>
    <div id="upcoming-list"></div>
  </div>

  <button class="btn-save-all" onclick="saveAllAssignments()">
    💾 Save Assignments
  </button>
</div>

<script src="athletehuddle.js?v=2"></script>
<script>
  // ── REAL DATA LOADING ────────────────────────────────────────
  let athletes = [];
  let sampleEvents = [];
  const assignments = {};

  async function loadRealData() {
    // Load real athletes for this family
    try {
      const familyId = await getFamilyId();
      if (familyId) {
        const fetched = await getAthletes(familyId);
        if (fetched && fetched.length) {
          athletes = fetched.map(a => ({ id: a.id, first_name: a.first_name, last_name: a.last_name }));
        }
      }
    } catch(e) { console.warn('Athletes load error:', e); }

    if (!athletes.length) {
      athletes = [
        { id:'demo-1', first_name:'Dominic', last_name:'D.' },
        { id:'demo-2', first_name:'Vincent', last_name:'D.' }
      ];
    }

    // Load real upcoming events from HomeHuddle events table
    try {
      const now = new Date().toISOString();
      const { data: events, error } = await db
        .from('events')
        .select('uid, name, sport, start, end, location, description, kid')
        .gte('start', now)
        .eq('is_duplicate', false)
        .order('start', { ascending: true });

      if (!error && events && events.length) {
        sampleEvents = events.map(e => ({
          id: e.uid,
          title: e.name,
          type: e.name && e.name.toLowerCase().includes('practice') ? 'practice'
              : e.name && e.name.toLowerCase().includes('tournament') ? 'tournament'
              : 'game',
          sport: e.sport || '',
          datetime: new Date(e.start),
          location: e.location || '',
          kid: e.kid || ''
        }));
      }
    } catch(e) { console.warn('Events load error:', e); }

    // Fallback if no events loaded
    if (!sampleEvents.length) {
      sampleEvents = [
        { id:'e1', title:'Eagles Baseball Practice', type:'practice', sport:'Baseball', datetime: new Date(Date.now()+86400000), location:'Field 3, North Park', kid:'Dominic' },
        { id:'e2', title:'Hockey Game', type:'game', sport:'Hockey', datetime: new Date(Date.now()+86400000*2), location:'LECOM Harborcenter', kid:'Dominic' }
      ];
    }

    // Pre-assign events based on kid name matching athlete
    sampleEvents.forEach(e => {
      assignments[e.id] = new Set();
      const match = athletes.find(a => e.kid && e.kid.toLowerCase().includes(a.first_name.toLowerCase()));
      if (match) assignments[e.id].add(match.id);
    });

    renderEvents();
  }

  loadRealData();
</script>
</body>
</html>
