<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · HomeHuddle</title>
<style>
  :root{
    --ink:#1a1a2e; --slate:#5b6b82; --mist:#8a97a8;
    --line:#e4e9f0; --field:#f4f6fa; --paper:#ffffff;
    --indigo:#3730a3; --indigo-soft:#eef0fb; --ok:#16794f; --warn:#b4423a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -200px,#e9ecfb 0%,transparent 60%),
      #f8fafc;
    color:var(--ink); min-height:100dvh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:380px; background:var(--paper);
    border:1px solid var(--line); border-radius:20px;
    box-shadow:0 20px 50px -28px rgba(26,26,46,.35);
    padding:32px 28px 26px; overflow:hidden;
  }
  .brand{display:flex; align-items:center; gap:9px; margin-bottom:22px}
  .brand .dot{width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,#3730a3,#5b54d6);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
  .brand b{font-size:16px;letter-spacing:-.01em}
  .brand span{font-size:11px;color:var(--mist);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  h1{font-size:21px;letter-spacing:-.02em;margin-bottom:5px}
  .lede{font-size:13.5px;color:var(--slate);line-height:1.5;margin-bottom:22px}
  label{display:block;font-size:12px;font-weight:700;color:var(--slate);margin-bottom:7px;letter-spacing:.01em}
  input{
    width:100%;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);
    background:var(--field);border-radius:11px;color:var(--ink);outline:none;
    transition:border-color .15s, background .15s;
  }
  input:focus{border-color:var(--indigo);background:#fff}
  .code-input{letter-spacing:.35em;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  button{
    width:100%;margin-top:16px;font-size:15px;font-weight:700;color:#fff;
    background:var(--indigo);border:none;border-radius:11px;padding:14px;cursor:pointer;
    transition:transform .05s, opacity .15s;
  }
  button:hover{opacity:.93} button:active{transform:translateY(1px)}
  button[disabled]{opacity:.5;cursor:not-allowed}
  .ghost{margin-top:11px;background:none;color:var(--slate);font-weight:600;font-size:13px;padding:6px}
  .ghost:hover{color:var(--indigo)}
  .msg{margin-top:14px;font-size:13px;line-height:1.45;padding:11px 13px;border-radius:10px;display:none}
  .msg.show{display:block}
  .msg.err{background:#fdeceb;color:var(--warn)}
  .msg.ok{background:#eaf6f0;color:var(--ok)}
  .meta{margin-top:18px;font-size:11.5px;color:var(--mist);text-align:center;line-height:1.5}
  .step2{display:none}
  .step2.show{display:block}
  .step1.hide{display:none}
  .sent-to{font-size:12.5px;color:var(--slate);margin-bottom:18px}
  .sent-to b{color:var(--ink)}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="dot">H</div>
      <div>
        <b>HomeHuddle</b><br>
        <span>powered by Venuewise</span>
      </div>
    </div>

    <!-- STEP 1: phone -->
    <div class="step1" id="step1">
      <h1>Sign in</h1>
      <p class="lede">Enter your mobile number and we'll text you a code. No password to remember.</p>
      <label for="phone">Mobile number</label>
      <input id="phone" type="tel" inputmode="tel" placeholder="(716) 555-0100" autocomplete="tel" />
      <button id="sendBtn">Text me a code</button>
    </div>

    <!-- STEP 2: code -->
    <div class="step2" id="step2">
      <h1>Enter your code</h1>
      <p class="sent-to">We texted a 6-digit code to <b id="sentTo"></b>.</p>
      <label for="code">Verification code</label>
      <input id="code" class="code-input" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" />
      <button id="verifyBtn">Verify &amp; continue</button>
      <button class="ghost" id="resendBtn">Use a different number</button>
    </div>

    <div class="msg" id="msg"></div>

    <p class="meta">By continuing you agree to our
      <a href="https://venuewise.net/homehuddle-terms.html" style="color:var(--slate)">Terms</a> and
      <a href="https://venuewise.net/homehuddle-privacy.html" style="color:var(--slate)">Privacy Policy</a>.</p>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://urwnbskrtoplgnkkxuvl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_NnATRFU2t1ATOHR07mFLoQ_ptkdjGDT";
    // Where to send people once they're signed in:
    const AFTER_LOGIN = "https://venuewise.net/homehuddle/calendar-merged.html";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);
    const msg = $("msg");
    let currentPhone = null;

    function show(text, kind){ msg.textContent = text; msg.className = "msg show " + kind; }
    function clear(){ msg.className = "msg"; }

    // Normalize a typed US number to E.164 (+1XXXXXXXXXX).
    function toE164(raw){
      const d = (raw || "").replace(/\D/g, "");
      if (d.length === 10) return "+1" + d;
      if (d.length === 11 && d[0] === "1") return "+" + d;
      if (raw.trim().startsWith("+")) return raw.trim();
      return null;
    }

    // If already signed in, skip straight to the app.
    (async () => {
      const { data:{ session } } = await supabase.auth.getSession();
      if (session) window.location.replace(AFTER_LOGIN);
    })();

    $("sendBtn").addEventListener("click", async () => {
      clear();
      const phone = toE164($("phone").value);
      if (!phone){ show("Enter a valid 10-digit US mobile number.", "err"); return; }
      currentPhone = phone;
      $("sendBtn").disabled = true; $("sendBtn").textContent = "Sending…";
      const { error } = await supabase.auth.signInWithOtp({ phone });
      $("sendBtn").disabled = false; $("sendBtn").textContent = "Text me a code";
      if (error){ show(error.message || "Couldn't send the code. Try again.", "err"); return; }
      $("sentTo").textContent = phone;
      $("step1").classList.add("hide");
      $("step2").classList.add("show");
      $("code").focus();
    });

    $("verifyBtn").addEventListener("click", async () => {
      clear();
      const token = $("code").value.replace(/\D/g, "");
      if (token.length !== 6){ show("Enter the 6-digit code from the text.", "err"); return; }
      $("verifyBtn").disabled = true; $("verifyBtn").textContent = "Verifying…";
      const { data, error } = await supabase.auth.verifyOtp({ phone: currentPhone, token, type: "sms" });
      if (error){
        $("verifyBtn").disabled = false; $("verifyBtn").textContent = "Verify & continue";
        show(error.message || "That code didn't match. Try again.", "err"); return;
      }
      show("You're in. Loading your calendar…", "ok");
      // The auth trigger links this person to their families server-side.
      setTimeout(() => window.location.assign(AFTER_LOGIN), 600);
    });

    $("resendBtn").addEventListener("click", () => {
      clear();
      $("step2").classList.remove("show");
      $("step1").classList.remove("hide");
      $("phone").focus();
    });

    // Enter-to-submit on each field.
    $("phone").addEventListener("keydown", e => { if(e.key==="Enter") $("sendBtn").click(); });
    $("code").addEventListener("keydown",  e => { if(e.key==="Enter") $("verifyBtn").click(); });
  </script>
</body>
</html>
