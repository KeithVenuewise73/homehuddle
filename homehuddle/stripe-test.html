<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stripe Checkout Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:sans-serif;max-width:480px;margin:60px auto;padding:20px;background:#f9f9f9;}
    h2{margin-bottom:8px;}
    p{color:#666;font-size:14px;margin-bottom:24px;}
    .status{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px;font-size:13px;line-height:1.6;}
    button{background:#635bff;color:#fff;border:none;padding:14px 28px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
    button:disabled{background:#aaa;cursor:not-allowed;}
    .err{color:#e00;font-size:13px;margin-top:12px;}
  </style>
</head>
<body>
  <h2>Stripe Checkout Test</h2>
  <p>Tests the full checkout flow using your existing session and family. Uses sandbox — no real charge.</p>
  <div class="status" id="status">Initializing…</div>
  <button id="btn" disabled onclick="startCheckout()">Start Stripe Checkout</button>
  <div class="err" id="err"></div>

  <script>
    const SURL = 'https://urwnbskrtoplgnkkxuvl.supabase.co';
    const SKEY = 'sb_publishable_NnATRFU2t1ATOHR07mFLoQ_ptkdjGDT';
    const FAMILY_ID = '905d8e9e-4881-4b09-8e7d-afb241c97202'; // D'Amico-Herman Family
    const sb = window.supabase.createClient(SURL, SKEY);

    let sessionToken = null;

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        document.getElementById('status').innerHTML = '⚠️ Not logged in — <a href="https://venuewise.net/homehuddle/login.html">sign in first</a>, then come back to this page.';
        return;
      }
      sessionToken = session.access_token;
      document.getElementById('status').innerHTML =
        '✅ Signed in as: ' + (session.user.phone || session.user.email) + '<br>' +
        '✅ Family ID: ' + FAMILY_ID + '<br>' +
        '✅ Ready to test Stripe checkout';
      document.getElementById('btn').disabled = false;
    }

    async function startCheckout() {
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Connecting to Stripe…';
      try {
        const res = await fetch(SURL + '/functions/v1/stripe-checkout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + sessionToken
          },
          body: JSON.stringify({ family_id: FAMILY_ID })
        });
        const data = await res.json();
        if (data.url) {
          document.getElementById('status').innerHTML =
            '🚀 Redirecting to Stripe…<br><small>Price tier: ' + data.price_tier + ' · ' + data.trial_days + '-day trial</small>';
          window.location.href = data.url;
        } else {
          err.textContent = 'Error: ' + (data.error || JSON.stringify(data));
          btn.disabled = false;
          btn.textContent = 'Start Stripe Checkout';
        }
      } catch(e) {
        err.textContent = 'Network error: ' + e.message;
        btn.disabled = false;
        btn.textContent = 'Start Stripe Checkout';
      }
    }

    init();
  </script>
</body>
</html>
