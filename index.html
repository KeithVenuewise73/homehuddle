<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeHuddle · Dominic's Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #0A1628;
      --navy-mid:  #0F1F3D;
      --navy-light:#162444;
      --gold:      #F5C518;
      --gold-dim:  #c49e10;
      --white:     #F0F4FF;
      --muted:     #7A8FAD;
      --orange:    #E8721C;
      --blue:      #1E6FD9;
      --green:     #1EA85A;
      --card-bg:   #111D35;
      --border:    rgba(245,197,24,0.12);
      --radius:    10px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--navy);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .header-brand { display: flex; flex-direction: column; line-height: 1; }

    .header-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.04em;
      color: var(--white);
      line-height: 1;
    }

    .header-logo .italic-gold {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--gold);
      font-size: 2rem;
      letter-spacing: 0;
    }

    .header-sub {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .header-sub span {
      color: var(--gold);
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }
    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── STATS BAR ── */
    .stats-bar {
      background: var(--navy-mid);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      text-align: center;
      padding: 8px 4px;
    }

    .stat-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--gold);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-top: 2px;
    }

    /* ── FILTERS ── */
    .controls {
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: var(--navy);
    }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1.5px solid transparent;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--card-bg);
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .filter-btn[data-platform="all"] { border-color: var(--gold); color: var(--gold); }
    .filter-btn[data-platform="all"].active { background: var(--gold); color: var(--navy); }

    .filter-btn[data-platform="west"].active { background: var(--orange); color: #fff; border-color: var(--orange); }
    .filter-btn[data-platform="west"]:hover { border-color: var(--orange); color: var(--orange); }

    .filter-btn[data-platform="caz"].active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .filter-btn[data-platform="caz"]:hover { border-color: var(--blue); color: var(--blue); }

    .filter-btn[data-platform="fcp"].active { background: var(--green); color: #fff; border-color: var(--green); }
    .filter-btn[data-platform="fcp"]:hover { border-color: var(--green); color: var(--green); }

    .filter-btn:not(.active):hover { border-color: var(--muted); color: var(--white); }

    .view-toggle {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .view-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .view-btn.active { background: var(--navy-light); border-color: var(--gold); color: var(--gold); }

    /* ── MAIN ── */
    main { padding: 16px 20px 80px; }

    /* ── LIST VIEW ── */
    #list-view { display: block; }
    #month-view { display: none; }

    .day-group { margin-bottom: 22px; }

    .day-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .day-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .day-label.today-label { color: var(--gold); }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 15px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.2s, transform 0.15s;
      cursor: default;
    }
    .event-card:hover { border-color: rgba(245,197,24,0.3); transform: translateX(2px); }

    .event-stripe {
      width: 3px;
      min-height: 42px;
      border-radius: 3px;
      flex-shrink: 0;
      align-self: stretch;
    }

    .event-body { flex: 1; min-width: 0; }

    .event-title {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .event-meta {
      font-size: 0.76rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .event-meta .dot { color: var(--border); }

    .event-location {
      color: var(--gold-dim);
      text-decoration: none;
      font-size: 0.74rem;
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 5px;
      width: fit-content;
      transition: color 0.15s;
    }
    .event-location:hover { color: var(--gold); }

    .event-badge {
      font-size: 0.63rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 2px;
    }

    .conflict-flag {
      font-size: 0.65rem;
      color: #FF6B6B;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 4px;
    }

    /* ── MONTH VIEW ── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .month-nav button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      width: 32px; height: 32px;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .month-nav button:hover { border-color: var(--gold); color: var(--gold); }

    .month-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.08em;
      color: var(--white);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .cal-dow {
      text-align: center;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding: 4px 0 8px;
    }

    .cal-day {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      min-height: 64px;
      padding: 4px;
      transition: border-color 0.2s;
    }
    .cal-day:hover { border-color: rgba(245,197,24,0.3); }
    .cal-day.other-month { opacity: 0.3; }
    .cal-day.today { border-color: var(--gold); }

    .cal-day-num {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      text-align: right;
      margin-bottom: 3px;
    }
    .cal-day.today .cal-day-num {
      color: var(--gold);
      font-weight: 700;
    }

    .cal-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      display: inline-block;
      margin: 1px;
    }

    /* ── EMPTY / LOADING ── */
    .state-msg {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .state-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .state-msg p { font-size: 0.88rem; }

    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 48px;
    }
    .loader span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
      animation: bounce 1s infinite ease-in-out;
    }
    .loader span:nth-child(2) { animation-delay: 0.15s; }
    .loader span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--navy-light);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.82rem;
      transition: transform 0.3s ease;
      z-index: 200;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .cal-day { min-height: 52px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-brand">
    <div class="header-logo">Home<span class="italic-gold">Huddle</span></div>
    <div class="header-sub">Dominic's schedule · powered by <span>Venuewise</span></div>
  </div>
  <div class="header-right">
    <button class="refresh-btn" id="refreshBtn" onclick="loadEvents(true)">
      <svg id="refreshIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        <polyline points="1 8 3 8 3 3"/><polyline points="23 16 21 16 21 21"/>
      </svg>
      Refresh
    </button>
  </div>
</header>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat"><div class="stat-val" id="statTotal">—</div><div class="stat-label">Events</div></div>
  <div class="stat"><div class="stat-val" id="statWeek">—</div><div class="stat-label">This Week</div></div>
  <div class="stat"><div class="stat-val" id="statConflicts">—</div><div class="stat-label">Conflicts</div></div>
  <div class="stat"><div class="stat-val" id="statUpdated">—</div><div class="stat-label">Updated</div></div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="filter-row">
    <button class="filter-btn active" data-platform="all" onclick="setFilter('all', this)">All Sports</button>
    <button class="filter-btn" data-platform="west" onclick="setFilter('west', this)">West Modified</button>
    <button class="filter-btn" data-platform="caz" onclick="setFilter('caz', this)">Caz Chiefs</button>
    <button class="filter-btn" data-platform="fcp" onclick="setFilter('fcp', this)">FCP Baseball</button>
    <div class="view-toggle">
      <button class="view-btn active" id="btnList" onclick="setView('list')">List</button>
      <button class="view-btn" id="btnMonth" onclick="setView('month')">Month</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<main>
  <div id="list-view"></div>
  <div id="month-view"></div>
</main>

<div id="toast"></div>

<script>
  // ── CONFIG ──
  const SUPABASE_URL = 'https://urwnbskrtoplgnkkxuvl.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_NnATRFU2t1ATOHR07mFLoQ_ptkdjGDT';
  const REFRESH_INTERVAL = 5 * 60 * 1000; // 5 min

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── STATE ──
  let allEvents = [];
  let activeFilter = 'all';
  let activeView = 'list';
  let monthOffset = 0; // for month view navigation

  // Platform mapping
  const PLATFORM_MAP = {
    west: { label: 'West Modified', color: '#E8721C' },
    caz:  { label: 'Caz Chiefs',    color: '#1E6FD9' },
    fcp:  { label: 'FCP Baseball',  color: '#1EA85A' },
  };

  function platformKey(event) {
    const src = (event.platform || event.team || event.source || event.calendar || '').toLowerCase();
    if (src.includes('west')) return 'west';
    if (src.includes('caz') || src.includes('chief')) return 'caz';
    if (src.includes('fcp') || src.includes('baseball')) return 'fcp';
    // fallback: cycle by id
    const keys = ['west','caz','fcp'];
    return keys[event.id % 3] || 'west';
  }

  // ── LOAD ──
  async function loadEvents(manual = false) {
    const btn = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    btn.classList.add('spinning');

    try {
      // Try common table names; adjust if yours differs
      let data, error;
      const attempt = async (table) => db.from(table).select('*').order('start_time', { ascending: true });

      ({ data, error } = await attempt('events'));
      if (error || !data?.length) ({ data, error } = await attempt('calendar_events'));
      if (error || !data?.length) ({ data, error } = await attempt('schedule'));
      if (error) throw error;

      allEvents = (data || []).map(e => ({
        ...e,
        _platformKey: platformKey(e),
        _start: new Date(e.start_time || e.start || e.date || e.event_date),
      })).filter(e => !isNaN(e._start));

      computeStats();
      render();
      if (manual) toast('✓ Updated just now');
    } catch (err) {
      console.error(err);
      showError(err.message || 'Could not load events');
    } finally {
      btn.classList.remove('spinning');
    }
  }

  // ── STATS ──
  function computeStats() {
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
    const weekEnd   = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 7);

    const total = allEvents.length;
    const thisWeek = allEvents.filter(e => e._start >= weekStart && e._start < weekEnd).length;

    // Detect conflicts: events on same day overlapping time (simple check)
    const dayBuckets = {};
    allEvents.forEach(e => {
      const key = e._start.toDateString();
      if (!dayBuckets[key]) dayBuckets[key] = [];
      dayBuckets[key].push(e);
    });
    let conflicts = 0;
    Object.values(dayBuckets).forEach(evts => {
      if (evts.length > 1) {
        // crude overlap: same day, different platforms
        const platforms = new Set(evts.map(e => e._platformKey));
        if (platforms.size > 1) conflicts++;
      }
    });

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statWeek').textContent  = thisWeek;
    document.getElementById('statConflicts').textContent = conflicts;

    const mins = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    document.getElementById('statUpdated').textContent = mins;
  }

  // ── FILTER ──
  function setFilter(key, btn) {
    activeFilter = key;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function filtered() {
    if (activeFilter === 'all') return allEvents;
    return allEvents.filter(e => e._platformKey === activeFilter);
  }

  // ── VIEW TOGGLE ──
  function setView(v) {
    activeView = v;
    document.getElementById('list-view').style.display  = v === 'list'  ? 'block' : 'none';
    document.getElementById('month-view').style.display = v === 'month' ? 'block' : 'none';
    document.getElementById('btnList').classList.toggle('active',  v === 'list');
    document.getElementById('btnMonth').classList.toggle('active', v === 'month');
    render();
  }

  // ── RENDER ──
  function render() {
    if (activeView === 'list') renderList();
    else renderMonth();
  }

  function renderList() {
    const container = document.getElementById('list-view');
    const evts = filtered();

    if (!evts.length) {
      container.innerHTML = `<div class="state-msg"><div class="icon">📅</div><p>No events found for this filter.</p></div>`;
      return;
    }

    // Group by day
    const groups = {};
    evts.forEach(e => {
      const key = e._start.toDateString();
      if (!groups[key]) groups[key] = [];
      groups[key].push(e);
    });

    const today = new Date().toDateString();
    let html = '';

    Object.entries(groups).forEach(([dateStr, dayEvts]) => {
      const d = new Date(dateStr);
      const isToday = dateStr === today;
      const label = isToday ? 'Today' : d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

      html += `<div class="day-group">
        <div class="day-label ${isToday ? 'today-label' : ''}">${label}</div>`;

      dayEvts.forEach(e => {
        const pk   = e._platformKey;
        const info = PLATFORM_MAP[pk] || { label: 'Event', color: '#7A8FAD' };
        const time = e._start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        const loc  = e.location || e.venue || e.address || '';
        const mapsUrl = loc ? `maps://maps.apple.com/?q=${encodeURIComponent(loc)}` : null;

        // conflict flag: check if another event overlaps on same day
        const sameDay = dayEvts.filter(x => x.id !== e.id);
        const hasConflict = sameDay.some(x => x._platformKey !== pk);

        html += `<div class="event-card">
          <div class="event-stripe" style="background:${info.color}"></div>
          <div class="event-body">
            <div class="event-title">${escHtml(e.title || e.name || 'Untitled Event')}</div>
            <div class="event-meta">
              <span>${time}</span>
              ${e.end_time ? `<span class="dot">·</span><span>– ${new Date(e.end_time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span>` : ''}
            </div>
            ${loc ? `<a class="event-location" href="${mapsUrl}" onclick="openMaps(event, '${escHtml(loc)}')">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
              ${escHtml(loc)}
            </a>` : ''}
            ${hasConflict ? `<div class="conflict-flag">⚠ Schedule conflict</div>` : ''}
          </div>
          <div class="event-badge" style="background:${info.color}22;color:${info.color}">${info.label}</div>
        </div>`;
      });

      html += `</div>`;
    });

    container.innerHTML = html;
  }

  function renderMonth() {
    const container = document.getElementById('month-view');
    const evts = filtered();

    const now = new Date();
    const viewDate = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
    const year  = viewDate.getFullYear();
    const month = viewDate.getMonth();

    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const monthLabel = viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    // Build dot map
    const dotMap = {};
    evts.forEach(e => {
      if (e._start.getFullYear() === year && e._start.getMonth() === month) {
        const d = e._start.getDate();
        if (!dotMap[d]) dotMap[d] = [];
        dotMap[d].push(e._platformKey);
      }
    });

    const dows = ['Su','Mo','Tu','We','Th','Fr','Sa'];
    let html = `
      <div class="month-nav">
        <button onclick="shiftMonth(-1)">&#8249;</button>
        <div class="month-title">${monthLabel}</div>
        <button onclick="shiftMonth(1)">&#8250;</button>
      </div>
      <div class="cal-grid">
        ${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}`;

    // leading blanks
    for (let i = 0; i < firstDow; i++) {
      html += `<div class="cal-day other-month"></div>`;
    }

    const todayDate = new Date();
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = todayDate.getFullYear() === year && todayDate.getMonth() === month && todayDate.getDate() === d;
      const dots = dotMap[d] || [];
      html += `<div class="cal-day ${isToday ? 'today' : ''}">
        <div class="cal-day-num">${d}</div>
        <div>${dots.slice(0,5).map(pk => {
          const c = PLATFORM_MAP[pk]?.color || '#7A8FAD';
          return `<span class="cal-dot" style="background:${c}"></span>`;
        }).join('')}</div>
      </div>`;
    }

    html += `</div>`;
    container.innerHTML = html;
  }

  function shiftMonth(delta) {
    monthOffset += delta;
    renderMonth();
  }

  // ── MAPS ──
  function openMaps(event, location) {
    event.preventDefault();
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const url = isIOS
      ? `maps://maps.apple.com/?q=${encodeURIComponent(location)}`
      : `https://maps.apple.com/?q=${encodeURIComponent(location)}`;
    window.open(url, '_blank');
  }

  // ── TOAST ──
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  // ── ERROR ──
  function showError(msg) {
    document.getElementById('list-view').innerHTML = `
      <div class="state-msg">
        <div class="icon">⚠️</div>
        <p>Could not load events.<br><small>${escHtml(msg)}</small></p>
      </div>`;
  }

  // ── UTILS ──
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── LOADING PLACEHOLDER ──
  function showLoader() {
    document.getElementById('list-view').innerHTML = `<div class="loader"><span></span><span></span><span></span></div>`;
  }

  // ── INIT ──
  showLoader();
  loadEvents();
  setInterval(() => loadEvents(), REFRESH_INTERVAL);
</script>
</body>
</html>
